name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MOCK_LLM: "1"
  NEXT_PUBLIC_DEV_TOOLS: "1"
  NEXT_PUBLIC_APP_URL: http://localhost:3100

jobs:
  checks:
    name: Lint, typecheck, unit, RLS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm test:rls

  smoke:
    name: Build and browser smoke test
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: ""
      - run: pnpm build
        env:
          MOCK_DB: "1"
      - run: |
          MOCK_DB=1 DRAFT_COOKIE_SECRET=ci-secret-ci-secret pnpm start -p 3100 &
          for i in $(seq 1 60); do curl -sf http://localhost:3100/api/health && break; sleep 1; done
          PW_CHROMIUM_PATH= node scripts/smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-shots
          path: test-shots
          retention-days: 7
